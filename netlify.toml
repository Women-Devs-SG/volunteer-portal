[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "vite --configLoader runner"
  targetPort = 5173
  port = 8888
  publish = "dev-static"
  autoLaunch = false

# Pretty API paths -> Netlify Functions. status 200 rewrites (not redirects),
# so the browser keeps calling /api/* and everything stays same-origin.
[[redirects]]
  from = "/api/create-task"
  to = "/.netlify/functions/create-task"
  status = 200

[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200

# Production page security headers live in static/_headers. Vite copies that
# file into dist for builds but does not expose it through Netlify Dev, where
# its CSP would block the React Fast Refresh preamble.

# Task data is private; never let a proxy or the browser cache an API response.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
